<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUYLORE Admin</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>DUYLORE · ADMIN</h1><p class="muted">Trang quản trị bản khởi đầu. Hãy dùng HTTPS và mật khẩu mạnh.</p><label>Mật khẩu Admin<br><input id="pass" type="password" style="width:100%;padding:12px;margin:8px 0;background:#1b102b;color:white;border:1px solid #65418a;border-radius:10px"></label><section class="promo"><h2>Thêm sản phẩm</h2><input id="name" placeholder="Tên sản phẩm"><input id="desc" placeholder="Mô tả"><input id="price" type="number" placeholder="Giá Stars"><button class="buy" onclick="addProduct()">Tạo sản phẩm</button></section><section class="promo"><h2>Thêm key vào kho</h2><input id="pid" type="number" placeholder="ID sản phẩm"><textarea id="keys" rows="7" placeholder="Mỗi key một dòng"></textarea><button class="buy" onclick="addKeys()">Nhập kho key</button></section><section class="promo"><h2>Tạo mã giảm giá</h2><input id="code" placeholder="VD: DUYLORE10"><input id="percent" type="number" placeholder="% giảm (1–90)"><button class="buy" onclick="addPromo()">Tạo mã</button></section><pre id="out" style="white-space:pre-wrap;color:#d9c3ee"></pre></main><script>
const $=id=>document.getElementById(id);async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json","x-admin-password":$("pass").value},body:JSON.stringify(body)});const d=await r.json();$("out").textContent=JSON.stringify(d,null,2);if(!r.ok)throw Error(d.error)}
async function addProduct(){try{await call("/api/admin/products",{name:$("name").value,description:$("desc").value,priceStars:Number($("price").value)})}catch(e){$("out").textContent=e.message}}
async function addKeys(){try{await call("/api/admin/inventory",{productId:Number($("pid").value),keys:$("keys").value})}catch(e){$("out").textContent=e.message}}
async function addPromo(){try{await call("/api/admin/promos",{code:$("code").value,percentOff:Number($("percent").value)})}catch(e){$("out").textContent=e.message}}
</script></body></html>
