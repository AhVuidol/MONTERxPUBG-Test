<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GOLD CONTROL • Virtual Money</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#09070d;--panel:#15101d;--line:#7047a0;--gold:#ffd34d;--green:#19ff91;--red:#ff496d;--text:#eee}
body{
  margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
  color:var(--text); background:
  radial-gradient(circle at 50% 0%,#3b145d 0,#170b25 35%,#07060a 75%);
  overflow-x:hidden;
}
.header{
  position:sticky;top:0;z-index:5;height:72px;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(8,6,12,.92);border-bottom:1px solid #4d2b69;
  backdrop-filter:blur(12px)
}
.logo{font-weight:900;color:var(--gold);letter-spacing:1px;font-size:18px}
.sub{font-size:10px;color:#a99bb7;margin-top:3px}
.balance{
  min-width:145px;text-align:right;color:var(--green);font-weight:900;
  font-size:20px;text-shadow:0 0 12px rgba(25,255,145,.35)
}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 35px}
.card{
  background:linear-gradient(145deg,rgba(35,19,48,.96),rgba(12,9,17,.97));
  border:1px solid #6e3e92;border-radius:18px;padding:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.45),inset 0 0 25px rgba(131,50,180,.08)
}
.title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.coin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(#ffe77a,#d79808);color:#3a2100;font-size:20px;
 box-shadow:0 0 16px rgba(255,211,77,.25)}
h1{font-size:17px;margin:0;color:var(--green);letter-spacing:1px}
.note{font-size:11px;color:#a99bb7;margin-top:3px}
.balanceBox{
  border:1px solid #148a61;border-radius:12px;padding:15px 10px;text-align:center;
  margin:12px 0 16px;background:rgba(0,0,0,.3)
}
#balance{font-size:30px;font-weight:900;color:var(--green);letter-spacing:1px}
.section{font-size:11px;color:#9d8aa9;text-align:center;margin:15px 0 8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{
  border:1px solid #523461;border-radius:9px;background:linear-gradient(#21182a,#120e18);
  color:#eee;padding:12px 5px;font-weight:800;font-size:13px;cursor:pointer;
  box-shadow:0 3px 0 #09060c;transition:.08s transform,.08s filter
}
button:active{transform:translateY(2px);filter:brightness(1.3);box-shadow:none}
.quick.plus{border-color:#167956;color:var(--green)}
.quick.minus{border-color:#8c2947;color:#ff6b87}
.quick.special{color:#e7d7ff;border-color:#76529a}
.custom{display:flex;gap:8px}
input{
  width:100%;min-width:0;border:1px solid #5a3b6d;border-radius:9px;
  background:#0c0910;color:white;padding:13px;font-size:16px;outline:none
}
input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(25,255,145,.08)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.set{color:#8ecbff;border-color:#28618b}
.add{color:var(--green);border-color:#167956}
.subbtn{color:#ff6b87;border-color:#8c2947}
.max{color:#ffd76a;border-color:#9b7421}
.reset{width:100%;margin-top:10px;color:#d7cbe0}
.history{
  margin-top:14px;border-top:1px solid #382340;padding-top:12px
}
.historyHead{display:flex;justify-content:space-between;align-items:center}
.historyHead b{font-size:13px}
.clear{padding:6px 9px;font-size:10px}
ul{list-style:none;padding:0;margin:8px 0 0;max-height:210px;overflow:auto}
li{
 display:flex;justify-content:space-between;gap:10px;padding:9px 3px;
 border-bottom:1px solid rgba(255,255,255,.05);font-size:12px
}
.plusTxt{color:var(--green)}.minusTxt{color:#ff6b87}
.empty{color:#817587;text-align:center;display:block}
.footer{text-align:center;color:#665b6d;font-size:10px;margin-top:15px}
@media(max-width:390px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .actions{grid-template-columns:repeat(2,1fr)}
 #balance{font-size:26px}
}
</style>
</head>
<body>
<header class="header">
  <div>
    <div class="logo">💰 GOLD CONTROL</div>
    <div class="sub">VIRTUAL MONEY • CHỈ DÙNG ĐỂ CHƠI VUI</div>
  </div>
  <div class="balance" id="topBalance">40,000,000</div>
</header>

<main class="wrap">
<section class="card">
  <div class="title">
    <div class="coin">₫</div>
    <div>
      <h1>GOLD CONTROL</h1>
      <div class="note">Điều khiển số dư tiền ảo</div>
    </div>
  </div>

  <div class="balanceBox">
    <div id="balance">40,000,000</div>
  </div>

  <div class="section">Preset nhanh</div>
  <div class="grid">
    <button class="quick special" data-action="add" data-value="1000000">1M</button>
    <button class="quick special" data-action="add" data-value="10000000">10M</button>
    <button class="quick special" data-action="add" data-value="100000000">100M</button>
    <button class="quick special" data-action="add" data-value="1000000000">1B</button>
  </div>

  <div class="section">Cộng / Trừ</div>
  <div class="grid">
    <button class="quick minus" data-action="sub" data-value="100000">-100K</button>
    <button class="quick plus" data-action="add" data-value="100000">+100K</button>
    <button class="quick plus" data-action="add" data-value="1000000">+1M</button>
    <button class="quick plus" data-action="add" data-value="10000000">+10M</button>
    <button class="quick minus" data-action="sub" data-value="1000000">-1M</button>
    <button class="quick minus" data-action="sub" data-value="10000000">-10M</button>
    <button class="quick special" data-action="multiply" data-value="2">×2</button>
    <button class="quick special" data-action="multiply" data-value="10">×10</button>
  </div>

  <div class="section">Nhập số tùy ý</div>
  <div class="custom">
    <input id="amount" type="number" min="0" step="1" placeholder="VD: 999999999">
  </div>

  <div class="actions">
    <button class="set" id="setBtn">SET</button>
    <button class="add" id="addBtn">+ ADD</button>
    <button class="subbtn" id="subBtn">- SUB</button>
    <button class="max" id="maxBtn">MAX</button>
  </div>

  <button class="reset" id="resetBtn">↺ RESET VỀ 40,000,000</button>

  <div class="history">
    <div class="historyHead">
      <b>📜 Lịch sử</b>
      <button class="clear" id="clearBtn">XÓA LỊCH SỬ</button>
    </div>
    <ul id="history"></ul>
  </div>
</section>

<div class="footer">Demo tiền ảo • Không có giá trị quy đổi thành tiền thật</div>
</main>

<script>
const START = 40000000;
const BAL_KEY = "gold_virtual_balance";
const HIS_KEY = "gold_virtual_history";

let balance = Number(localStorage.getItem(BAL_KEY));
if (!Number.isFinite(balance) || balance < 0) balance = START;

let history = [];
try { history = JSON.parse(localStorage.getItem(HIS_KEY)) || []; } catch(e){ history=[]; }

const money = n => new Intl.NumberFormat("vi-VN").format(Math.floor(n));

function save(){
  localStorage.setItem(BAL_KEY, String(balance));
  localStorage.setItem(HIS_KEY, JSON.stringify(history.slice(0,50)));
}

function render(){
  document.getElementById("balance").textContent = money(balance);
  document.getElementById("topBalance").textContent = money(balance);

  const ul = document.getElementById("history");
  if(!history.length){
    ul.innerHTML = '<li><span class="empty">Chưa có giao dịch</span></li>';
    return;
  }
  ul.innerHTML = history.slice(0,30).map(x => `
    <li>
      <span>${x.time}<br>${x.action}</span>
      <strong class="${x.delta >= 0 ? "plusTxt":"minusTxt"}">
        ${x.delta >= 0 ? "+" : ""}${money(x.delta)}
      </strong>
    </li>
  `).join("");
}

function addHistory(action, delta){
  history.unshift({
    time:new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),
    action,
    delta
  });
  save(); render();
}

function getAmount(){
  const n = Number(document.getElementById("amount").value);
  if(!Number.isFinite(n) || n < 0){
    alert("Vui lòng nhập số tiền hợp lệ.");
    return null;
  }
  return Math.floor(n);
}

function change(type, value){
  const old = balance;

  if(type === "add") balance += value;
  if(type === "sub") balance = Math.max(0, balance - value);
  if(type === "multiply") balance *= value;
  if(balance > Number.MAX_SAFE_INTEGER) balance = Number.MAX_SAFE_INTEGER;

  addHistory(
    type === "multiply" ? `Nhân ×${value}` : (type === "add" ? `Cộng ${money(value)}` : `Trừ ${money(value)}`),
    balance - old
  );
}

document.querySelectorAll("[data-action]").forEach(btn=>{
  btn.addEventListener("click",()=>change(btn.dataset.action, Number(btn.dataset.value)));
});

document.getElementById("setBtn").onclick=()=>{
  const n=getAmount(); if(n===null)return;
  const old=balance; balance=n;
  addHistory(`SET → ${money(n)}`,balance-old);
};

document.getElementById("addBtn").onclick=()=>{
  const n=getAmount(); if(n===null)return;
  change("add",n);
};

document.getElementById("subBtn").onclick=()=>{
  const n=getAmount(); if(n===null)return;
  change("sub",n);
};

document.getElementById("maxBtn").onclick=()=>{
  const old=balance; balance=Number.MAX_SAFE_INTEGER;
  addHistory("MAX",balance-old);
};

document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("Reset số dư về 40,000,000?")) return;
  const old=balance; balance=START;
  addHistory("RESET",balance-old);
};

document.getElementById("clearBtn").onclick=()=>{
  if(!confirm("Xóa toàn bộ lịch sử?")) return;
  history=[]; save(); render();
};

document.getElementById("amount").addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("addBtn").click();
});

render();
</script>
</body>
</html>
